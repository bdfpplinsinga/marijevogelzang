message: "Hi there Marije Vogelzang,\r\n\r\nI run a small agency too, and for a long time our client work lived everywhere. Sheets, docs, WhatsApp chats, invoice tools, all separate.\r\n\r\nSo we ended up building a small tool for ourselves called sync.d. It keeps clients, projects, invoices and docs in one place. Clients can also see progress on their own, which has been nice.\r\n\r\n\r\nSharing in case it helps. You can try it free if you're curious:\r\nhttps://sync.digithinktech.com\r\n\r\nHonest feedback is always welcome.\r\n\r\nBest,\r\nMayank Setia"
